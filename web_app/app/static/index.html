<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition System</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .container { display: flex; gap: 20px; }
        .box { flex: 1; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        h2 { margin-top: 0; }
        .result { margin-top: 10px; font-weight: bold; }
        img { max-width: 100%; margin-top: 10px; border-radius: 4px; }
        button { cursor: pointer; padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>Face Recognition System</h1>
    
    <div class="container">
        <!-- Enrollment Section -->
        <div class="box">
            <h2>1. Enroll Person</h2>
            <form id="enrollForm">
                <p>
                    <label>Name:</label><br>
                    <input type="text" id="enrollName" required placeholder="e.g. John Doe">
                </p>
                
                <div style="margin-bottom: 10px;">
                    <label><strong>Photo Source:</strong></label><br>
                    <label><input type="radio" name="enrollSource" value="upload" checked onchange="toggleEnrollSource()"> Upload File</label>
                    <label><input type="radio" name="enrollSource" value="webcam" onchange="toggleEnrollSource()"> Use Webcam</label>
                </div>

                <!-- Upload UI -->
                <div id="enrollUploadUI">
                    <input type="file" id="enrollFile" accept="image/*">
                </div>

                <!-- Webcam UI -->
                <div id="enrollWebcamUI" style="display:none;">
                    <div style="position: relative; width: 320px; height: 240px; background: #000; margin-bottom: 10px;">
                        <video id="enrollVideo" width="320" height="240" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover; display:none;"></video>
                        <img id="enrollPreview" width="320" height="240" style="width: 100%; height: 100%; object-fit: cover; display:none;">
                    </div>
                    <canvas id="enrollCanvas" width="320" height="240" style="display:none;"></canvas>
                    
                    <button type="button" id="startEnrollCamBtn" onclick="startEnrollCamera()">Start Camera</button>
                    <button type="button" id="captureEnrollBtn" onclick="captureEnrollPhoto()" style="display:none;">Capture Photo</button>
                    <button type="button" id="retakeEnrollBtn" onclick="retakeEnrollPhoto()" style="display:none;">Retake</button>
                </div>

                <br>
                <button type="submit" style="margin-top: 10px;">Enroll</button>
            </form>
            <div id="enrollResult" class="result"></div>
        </div>

        <!-- Recognition Section -->
        <div class="box">
            <h2>2. Recognize Person</h2>
            <form id="recognizeForm">
                <p>
                    <label>Upload Photo to Check:</label><br>
                    <input type="file" id="recognizeFile" accept="image/*" required>
                </p>
                <button type="submit">Recognize</button>
            </form>
            <div id="recognizeResult" class="result"></div>
            <img id="previewImg" style="display:none;">
        </div>
    </div>

    <!-- Real-Time Webcam Section -->
    <div class="container" style="margin-top: 20px;">
        <div class="box">
            <h2>3. Real-Time Webcam</h2>
            <div style="position: relative; display: inline-block;">
                <video id="webcam" width="640" height="480" autoplay playsinline style="border: 1px solid #ccc; border-radius: 4px;"></video>
                <canvas id="overlay" width="640" height="480" style="position: absolute; top: 0; left: 0; pointer-events: none;"></canvas>
            </div>
            <br>
            <button id="startCamBtn">Start Webcam</button>
            <button id="stopCamBtn" style="background: #dc3545; display: none;">Stop Webcam</button>
            <div id="camResult" class="result"></div>
        </div>
    </div>

    <script>
        // --- Enrollment Webcam Logic ---
        let enrollStream = null;
        let enrollBlob = null;

        function toggleEnrollSource() {
            const source = document.querySelector('input[name="enrollSource"]:checked').value;
            document.getElementById('enrollUploadUI').style.display = source === 'upload' ? 'block' : 'none';
            document.getElementById('enrollWebcamUI').style.display = source === 'webcam' ? 'block' : 'none';
            
            if (source === 'upload' && enrollStream) {
                stopEnrollCamera();
            }
        }

        async function startEnrollCamera() {
            try {
                enrollStream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('enrollVideo');
                video.srcObject = enrollStream;
                video.style.display = 'block';
                document.getElementById('enrollPreview').style.display = 'none';
                
                document.getElementById('startEnrollCamBtn').style.display = 'none';
                document.getElementById('captureEnrollBtn').style.display = 'inline-block';
                document.getElementById('retakeEnrollBtn').style.display = 'none';
            } catch (err) {
                alert("Error accessing webcam: " + err.message);
            }
        }

        function stopEnrollCamera() {
            if (enrollStream) {
                enrollStream.getTracks().forEach(track => track.stop());
                enrollStream = null;
            }
            document.getElementById('enrollVideo').style.display = 'none';
            document.getElementById('startEnrollCamBtn').style.display = 'inline-block';
            document.getElementById('captureEnrollBtn').style.display = 'none';
            document.getElementById('retakeEnrollBtn').style.display = 'none';
        }

        function captureEnrollPhoto() {
            const video = document.getElementById('enrollVideo');
            const canvas = document.getElementById('enrollCanvas');
            const preview = document.getElementById('enrollPreview');
            
            if (!enrollStream) return;

            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob(blob => {
                enrollBlob = blob;
                preview.src = URL.createObjectURL(blob);
                preview.style.display = 'block';
                video.style.display = 'none';
                
                document.getElementById('captureEnrollBtn').style.display = 'none';
                document.getElementById('retakeEnrollBtn').style.display = 'inline-block';
            }, 'image/jpeg');
        }

        function retakeEnrollPhoto() {
            enrollBlob = null;
            document.getElementById('enrollPreview').style.display = 'none';
            document.getElementById('enrollVideo').style.display = 'block';
            document.getElementById('captureEnrollBtn').style.display = 'inline-block';
            document.getElementById('retakeEnrollBtn').style.display = 'none';
        }

        // Handle Enrollment Submission
        document.getElementById('enrollForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('enrollResult');
            const name = document.getElementById('enrollName').value;
            const source = document.querySelector('input[name="enrollSource"]:checked').value;
            
            let fileToSend = null;

            if (source === 'upload') {
                const fileInput = document.getElementById('enrollFile');
                if (fileInput.files.length > 0) {
                    fileToSend = fileInput.files[0];
                }
            } else {
                if (enrollBlob) {
                    fileToSend = enrollBlob;
                }
            }

            if (!fileToSend) {
                alert("Please select a file or capture a photo.");
                return;
            }

            resultDiv.textContent = "Enrolling...";
            
            const formData = new FormData();
            formData.append('name', name);
            formData.append('file', fileToSend, 'enrollment.jpg');

            try {
                const response = await fetch('/enroll', { method: 'POST', body: formData });
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.textContent = `✅ Success: ${data.message}`;
                    resultDiv.style.color = "green";
                    // Reset form
                    document.getElementById('enrollName').value = '';
                    document.getElementById('enrollFile').value = '';
                    enrollBlob = null;
                    if (source === 'webcam') {
                        retakeEnrollPhoto(); // Reset UI to camera view
                    }
                } else {
                    resultDiv.textContent = `❌ Error: ${data.detail}`;
                    resultDiv.style.color = "red";
                }
            } catch (err) {
                resultDiv.textContent = "❌ Network Error";
            }
        });

        // Handle Recognition
        document.getElementById('recognizeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('recognizeResult');
            const fileInput = document.getElementById('recognizeFile');
            const previewImg = document.getElementById('previewImg');
            
            resultDiv.textContent = "Analyzing...";
            
            // Show preview
            const file = fileInput.files[0];
            previewImg.src = URL.createObjectURL(file);
            previewImg.style.display = 'block';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/recognize', { method: 'POST', body: formData });
                const data = await response.json();
                
                if (response.ok) {
                    const score = (data.score * 100).toFixed(1);
                    const detConf = (data.det_conf * 100).toFixed(1);
                    
                    if (data.match === "Unknown") {
                        resultDiv.textContent = `❓ Unknown Person (Rec: ${score}%) | YOLO Det: ${detConf}%`;
                        resultDiv.style.color = "orange";
                    } else {
                        resultDiv.textContent = `✅ Match: ${data.match} (Rec: ${score}%) | YOLO Det: ${detConf}%`;
                        resultDiv.style.color = "green";
                    }
                } else {
                    resultDiv.textContent = `❌ Error: ${data.detail}`;
                    resultDiv.style.color = "red";
                }
            } catch (err) {
                resultDiv.textContent = "❌ Network Error";
            }
        });

        // Real-Time Webcam Logic
        const video = document.getElementById('webcam');
        const overlay = document.getElementById('overlay');
        const ctx = overlay.getContext('2d');
        const startBtn = document.getElementById('startCamBtn');
        const stopBtn = document.getElementById('stopCamBtn');
        const camResult = document.getElementById('camResult');
        
        let stream = null;
        let intervalId = null;
        let isProcessing = false;

        startBtn.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                startBtn.style.display = 'none';
                stopBtn.style.display = 'inline-block';
                
                // Start processing loop
                intervalId = setInterval(processFrame, 500); // Check every 500ms
            } catch (err) {
                console.error("Error accessing webcam:", err);
                alert("Could not access webcam. Please allow permissions.");
            }
        });

        stopBtn.addEventListener('click', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            if (intervalId) clearInterval(intervalId);
            ctx.clearRect(0, 0, overlay.width, overlay.height);
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
            camResult.textContent = "";
        });

        async function processFrame() {
            if (isProcessing) return; // Skip if previous request is still running
            isProcessing = true;

            try {
                // Capture frame
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                // Convert to blob
                canvas.toBlob(async (blob) => {
                    if (!blob) { isProcessing = false; return; }

                    const formData = new FormData();
                    formData.append('file', blob, 'frame.jpg');

                    try {
                        const response = await fetch('/recognize', { method: 'POST', body: formData });
                        const data = await response.json();

                        // Clear previous drawings
                        ctx.clearRect(0, 0, overlay.width, overlay.height);

                        // Ensure overlay matches video size
                        if (overlay.width !== video.videoWidth || overlay.height !== video.videoHeight) {
                            overlay.width = video.videoWidth;
                            overlay.height = video.videoHeight;
                        }

                        if (response.ok) {
                            if (data.box) {
                                const [x1, y1, x2, y2] = data.box;
                                const score = (data.score * 100).toFixed(1);
                                const detConf = (data.det_conf * 100).toFixed(0);
                                const name = data.match;
                                const color = name === "Unknown" ? "red" : "#00ff00";

                                // Draw Box
                                ctx.strokeStyle = color;
                                ctx.lineWidth = 3;
                                ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

                                // Draw Label
                                ctx.fillStyle = color;
                                ctx.font = "bold 18px Arial";
                                ctx.fillText(`${name} ${score}% | Det ${detConf}%`, x1, y1 - 10);
                                
                                camResult.textContent = `Detected: ${name} (Rec: ${score}%, Det: ${detConf}%)`;
                                camResult.style.color = name === "Unknown" ? "orange" : "green";
                            } else {
                                camResult.textContent = "No face detected";
                                camResult.style.color = "gray";
                            }
                        }
                    } catch (err) {
                        console.error("Recognition error:", err);
                    } finally {
                        isProcessing = false;
                    }
                }, 'image/jpeg');
            } catch (err) {
                isProcessing = false;
            }
        }
    </script>
</body>
</html>
